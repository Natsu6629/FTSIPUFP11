<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grille de notation – Police nationale (accès sécurisé)</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#142038;--muted:#5b6882;--line:#dde3ee;--navy:#0b2a5b;--navy2:#163c7d;--red:#c8102e;--ok:#1d8a4e;--warn:#d98200}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 20px 18px;border-bottom:5px solid var(--red)}
header.top .in{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{margin:0 0 2px;font-size:1.35rem}
header.top p{margin:0;opacity:.85;font-size:.88rem}
main{max-width:1100px;margin:auto;padding:16px 16px 60px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(10,30,70,.04);scroll-margin-top:130px}
.card h2{margin:0 0 10px;font-size:1.06rem;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.badge{font-size:.85rem;font-weight:700;background:var(--navy);color:#fff;border-radius:20px;padding:3px 12px;white-space:nowrap}
.badge.low{background:var(--red)}.badge.good{background:var(--ok)}.badge.off{background:#8a96ad}
.coef{font-weight:500;color:var(--muted);font-size:.78rem}
label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:3px;font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=password],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input:disabled,textarea:disabled,select:disabled{background:#f0f2f7;color:#7b869c;cursor:not-allowed}
input:focus,textarea:focus,select:focus{outline:2px solid var(--navy2);outline-offset:0;border-color:var(--navy2)}
textarea{min-height:56px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;font-size:.88rem}
button:disabled{opacity:.45;cursor:not-allowed}
button.sec{background:#fff;color:var(--navy)}
button.danger{background:#fff;color:var(--red);border-color:var(--red)}
button.del{background:var(--red);border-color:var(--red)}
button.small{padding:4px 10px;font-size:.78rem}
button.hb{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45);color:#fff}
button.bigbtn{padding:10px 18px;font-size:.95rem;background:var(--red);border-color:var(--red)}
button:hover:not(:disabled){filter:brightness(1.08)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:.78rem;color:var(--muted);margin:8px 0 0}
/* gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.gbox{background:#fff;border-radius:16px;padding:26px 26px 22px;max-width:410px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:6px solid var(--red)}
.gbox h1{margin:4px 0 2px;font-size:1.3rem}
.gbox .sub{color:var(--muted);font-size:.86rem;margin-bottom:12px}
.gbox label{margin-top:10px}
.err{color:var(--red);font-size:.85rem;margin-top:10px;min-height:1.2em}
.okmsg{color:var(--ok)}
.pw{position:relative}
.pw button{position:absolute;right:4px;top:4px;padding:2px 8px}
.gload{color:#fff;font-weight:600}
/* userbar */
.me{display:flex;gap:10px;align-items:center;font-size:.85rem;line-height:1.35}
.av{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;border:3px solid #fff;flex:none}
.gb{display:inline-block;padding:1px 9px;border-radius:10px;color:#fff;font-size:.72rem;font-weight:700;margin-right:4px;white-space:nowrap}
.gb.adm{background:var(--red)}
.ubar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* stats / list */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);font-weight:600}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:640px){.toolbar{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:left}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover td{background:#f0f4fb}
td.n b{color:var(--navy2)}
td.low{color:var(--red);font-weight:700}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;color:#fff;font-size:.74rem;font-weight:700}
.mini{display:inline-block;width:46px;height:6px;border-radius:4px;background:#e4e9f3;vertical-align:middle;margin-left:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--navy2)}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
/* editor */
#editor{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;overflow:auto}
#editor.on{display:block}
.ebox{max-width:1100px;margin:auto;padding:0 16px 40px}
.ehead{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 0}
.ehead .l1{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ehead .ttl{font-weight:800;font-size:1.1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ehead .live{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:8px}
.navchips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.navchips a{flex:none;text-decoration:none;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:.82rem;font-weight:600}
.egrid{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
@media(max-width:900px){.egrid{grid-template-columns:1fr}}
.egrid .side{position:sticky;top:120px}
@media(max-width:900px){.egrid .side{position:static}}
.crit{display:grid;grid-template-columns:1fr 160px 70px 30px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.crit .name{font-size:.93rem;font-weight:600}
.crit .name small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.crit input[type=range]{width:100%;accent-color:var(--navy2)}
.crit input[type=range].unset{opacity:.3}
.crit .nb{text-align:center;font-weight:700;padding:6px 4px}
.crit .x{background:none;border:0;color:var(--muted);padding:0;font-size:1.2rem;line-height:1}
@media(max-width:600px){.crit{grid-template-columns:1fr 70px 30px}.crit .name{grid-column:1/-1}.crit input[type=range]{grid-column:1}}
.tools{display:flex;gap:8px;margin:8px 0 10px}
.lock{font-size:.76rem;color:var(--muted);font-weight:500}
.big{font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:1.1rem;color:var(--muted);font-weight:600}
.verdict{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:20px;color:#fff;font-weight:700;font-size:.85rem}
.bar{margin:9px 0}
.bar .l{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:3px}
.bar .t{height:9px;background:#e8ecf4;border-radius:6px;overflow:hidden}
.bar .f{height:100%;background:var(--navy2);border-radius:6px;transition:width .2s}
.bar .f.low{background:var(--red)}
pre#bil{white-space:pre-wrap;background:#f6f8fc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.78rem;display:none}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.ov.on{display:flex}
#sheet{z-index:60}#modal{z-index:80;align-items:center}
.ov .box{background:#fff;border-radius:14px;width:100%;max-width:760px;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modal .box{max-width:400px}
.ov h3{margin:0;font-size:1.15rem}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.set-ep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.set-ep .h{display:grid;grid-template-columns:50px 1fr 90px;gap:8px;margin-bottom:8px}
.set-cr{display:grid;grid-template-columns:1.2fr 1.6fr 70px 30px;gap:6px;margin-bottom:6px}
@media(max-width:600px){.set-cr{grid-template-columns:1fr 60px 30px}.set-cr .dd{grid-column:1/-1;order:3}}
.frm{display:grid;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:2px 0;color:var(--ink);font-weight:500}
.chk input{width:auto}
.mx{border-collapse:collapse;font-size:.82rem;width:auto;min-width:100%}
.mx th,.mx td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:normal}
.mx td.p,.mx th.p{text-align:left;position:sticky;left:0;background:#fff;min-width:210px;z-index:1}
.mx tr.grp td{background:#eef2f9;font-weight:700;text-align:left}
.mx th input[type=text]{font-size:.78rem;padding:4px 6px}
.mx select{font-size:.74rem;padding:3px}
.pcat{font-weight:700;margin:12px 0 4px;font-size:.86rem;color:var(--navy2)}
.pline{display:grid;grid-template-columns:1fr 190px;gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line);font-size:.86rem}
.pw-show{font-family:monospace;font-size:1.2rem;background:#f1f5fc;border:1px dashed var(--navy2);padding:10px;border-radius:8px;text-align:center;letter-spacing:1px;user-select:all}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="gate"><div class="gload">Chargement…</div></div>

<div id="app" hidden>
<header class="top"><div class="in">
  <div><h1>🛡️ Grille de notation – Police nationale</h1><p>Oral · Tir · Sport · Conduite</p></div>
  <div class="ubar" id="userbar"></div>
</div></header>

<main>
  <section class="stats" id="stats"></section>

  <section class="card" id="listCard">
    <h2>Candidats <button class="bigbtn" id="addBtn">＋ Nouveau candidat</button></h2>
    <div class="toolbar" id="toolbar">
      <input type="search" id="q" placeholder="🔍 Rechercher un nom, un n°, un évaluateur…">
      <select id="fil">
        <option value="all">Tous les avis</option><option value="fav">Favorable</option><option value="ins">Insuffisant</option><option value="def">Défavorable</option><option value="cours">En cours</option>
      </select>
      <select id="srt"></select>
    </div>
    <div class="tw" id="tbl"></div>
  </section>

  <section class="card" id="toolsCard">
    <h2>Outils</h2>
    <div class="btns">
      <button class="sec" id="tRank" data-perm="export">📋 Copier le classement</button>
      <button class="sec" id="tCsv" data-perm="export">📊 Copier en CSV (Excel)</button>
      <button class="sec" id="tBackup" data-perm="export">💾 Copier une sauvegarde</button>
      <button class="sec" id="tImport" data-perm="config">📥 Importer une sauvegarde</button>
      <button class="sec" id="tSet" data-perm="config">⚙️ Critères, coefficients & seuils</button>
      <button class="danger" id="tAll" data-perm="cand_suppr">🗑 Tout effacer</button>
    </div>
    <p class="note" id="modeNote"></p>
  </section>
</main>

<div id="editor"><div class="ebox">
  <div class="ehead">
    <div class="l1">
      <div class="btns"><button class="sec" id="eclose">← Retour à la liste</button><button class="sec" id="ePrev" title="Candidat précédent">‹</button><button class="sec" id="eNext" title="Candidat suivant">›</button></div>
      <div class="ttl" id="etitle"></div>
      <div class="live" id="liveBox"><span id="lTotal">—</span><span class="tag" id="lVerdict">—</span></div>
    </div>
    <div class="navchips" id="navchips"></div>
  </div>
  <div class="egrid">
    <div>
      <section class="card" id="s-info">
        <h2>🧑 Candidat <span class="lock" id="infoLock"></span></h2>
        <div class="row">
          <div><label for="f-nom">Nom et prénom</label><input type="text" id="f-nom" placeholder="Ex. Martin Léa" autocomplete="off"></div>
          <div><label for="f-num">N° de candidat</label><input type="text" id="f-num"></div>
          <div><label for="f-date">Date</label><input type="date" id="f-date"></div>
          <div><label for="f-eval">Évaluateur</label><input type="text" id="f-eval"></div>
        </div>
      </section>
      <div id="eps" style="display:grid;gap:16px;margin-top:16px"></div>
      <section class="card" id="s-bilan" style="margin-top:16px">
        <h2>📝 Appréciation générale</h2>
        <textarea id="f-generale" placeholder="Points forts, axes d'amélioration, avis global…"></textarea>
      </section>
    </div>
    <div class="side">
      <div class="card">
        <h2>Résultat</h2>
        <div id="resBox">
          <div class="big" id="pTotal">—<span> / 20</span></div>
          <div id="pVerdict" class="verdict">—</div>
        </div>
        <div style="margin-top:12px;font-size:.82rem;color:var(--muted)" id="pProg"></div>
        <div class="bar" style="margin-top:4px"><div class="t"><div class="f" id="pProgBar" style="width:0"></div></div></div>
        <div id="pBars" style="margin-top:10px"></div>
        <div class="btns" style="margin-top:12px">
          <button id="eNextSave">💾 Enregistrer et suivant ›</button>
          <button class="sec" id="eCopy">📋 Copier le bilan</button>
          <button class="danger" id="eDel">🗑 Supprimer</button>
        </div>
        <p class="note">Enregistrement automatique. Astuce : tapez la note puis <b>Entrée</b> pour passer au critère suivant.</p>
        <pre id="bil"></pre>
      </div>
    </div>
  </div>
</div></div>
</div>

<div class="ov" id="sheet"><div class="box" id="sbox"></div></div>
<div class="ov" id="modal"><div class="box"><p id="mmsg" style="margin:0 0 16px"></p><div class="btns" style="justify-content:flex-end"><button class="sec" id="mno">Annuler</button><button class="del" id="myes">Supprimer</button></div></div></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   OUTILS
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"—":(Math.round(n*100)/100).toString().replace(".",",");
const nm=c=>(c.nom||"").trim()||"Sans nom";
const clone=o=>JSON.parse(JSON.stringify(o));
const isObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
function deepMerge(a,b){const o=Object.assign({},a);for(const k in b){o[k]=isObj(b[k])&&isObj(o[k])?deepMerge(o[k],b[k]):b[k]}return o}
const RED="#c8102e",OK="#1d8a4e",WARN="#d98200",GREY="#6b7893";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600)}
function fail(e){console.error(e);toast(e&&e.code==="invalid_argument"?"Action refusée : droits insuffisants sur la base (niveau Contributeur requis)":"Erreur d'enregistrement des données")}
const dt=t=>t?new Date(t).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}):"jamais";

/* =====================================================================
   COUCHE DE DONNÉES : base partagée (db) ou stockage local de secours
   ===================================================================== */
let DBAPI=null,USERAPI=null,ONPLATFORM=false;
async function initPlatform(){
  // la plateforme injecte "claude" après le premier passage du script : on l'attend
  for(let i=0;i<80&&!(typeof claude!=="undefined"&&claude&&claude.use);i++)await new Promise(r=>setTimeout(r,100));
  if(typeof claude!=="undefined"&&claude&&claude.use){
    ONPLATFORM=true;
    status("Connexion à la base de données…");
    try{DBAPI=await tmo(claude.use("db"),14000,"Base de données")}catch(e){DBAPI=null;BOOTERR=e}
    try{USERAPI=await tmo(claude.use("user"),8000,"Identité")}catch(e){USERAPI=null}
  }
}
let BOOTERR=null;
const tmo=(p,ms,label)=>Promise.race([Promise.resolve(p),new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout",message:label+" : pas de réponse après "+Math.round(ms/1000)+" s"}),ms))]);
const status=t=>{const g=document.querySelector("#gate .gload");if(g)g.textContent=t};
const errTxt=e=>e?(e.code?e.code+" – ":"")+(e.message||String(e)):"";
const withId=(id,d)=>Object.assign({id},clone(d));
const Cloud={
  async get(p){const s=await DBAPI.doc(p).get();return s.exists?clone(s.data()):null},
  set(p,o){return DBAPI.doc(p).set(o)},
  update(p,o){return DBAPI.doc(p).update(o)},
  del(p){return DBAPI.doc(p).delete()},
  async list(c){const s=await DBAPI.collection(c).get();return s.docs.map(d=>withId(d.id,d.data()))},
  watch(c,cb,err){return DBAPI.collection(c).onSnapshot(s=>cb(s.docs.map(d=>withId(d.id,d.data()))),err||(()=>{}))},
  watchDoc(p,cb,err){return DBAPI.doc(p).onSnapshot(s=>cb(s.exists?clone(s.data()):null),err||(()=>{}))}
};
const Local=(()=>{
  const K="pn3-local";let m={};const ls=[];
  const load=()=>{try{m=JSON.parse(localStorage.getItem(K))||{}}catch(e){m={}}};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(m))}catch(e){}};
  const inColl=(p,c)=>p.indexOf(c+"/")===0&&p.split("/").length===c.split("/").length+1;
  const items=c=>Object.keys(m).filter(p=>inColl(p,c)).map(p=>withId(p.split("/").pop(),m[p]));
  const notify=()=>ls.slice().forEach(f=>f());
  load();
  addEventListener("storage",e=>{if(e.key===K){load();notify()}});
  const sub=f=>{ls.push(f);setTimeout(f,0);return()=>{const i=ls.indexOf(f);if(i>=0)ls.splice(i,1)}};
  return{
    async get(p){return m[p]?clone(m[p]):null},
    async set(p,o){m[p]=clone(o);save();notify()},
    async update(p,o){if(!m[p])throw{code:"invalid_argument",message:"document absent"};m[p]=deepMerge(m[p],clone(o));save();notify()},
    async del(p){delete m[p];save();notify()},
    async list(c){return items(c)},
    watch(c,cb){return sub(()=>cb(items(c)))},
    watchDoc(p,cb){return sub(()=>cb(m[p]?clone(m[p]):null))}
  };
})();
let S=Local;
const chains={};
function enqueue(path,fn){const p=(chains[path]||Promise.resolve()).catch(()=>{}).then(fn);chains[path]=p;return p}

/* =====================================================================
   CRYPTO : mots de passe salés (PBKDF2-SHA256)
   ===================================================================== */
const enc=new TextEncoder();
const b64=buf=>btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
const ITER=150000;
async function hashPw(pw,salt,iter){
  const key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  return b64(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:unb64(salt),iterations:iter||ITER},key,256));
}
function genPw(){
  const al="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>al[x%al.length]).join("");
}
const UREG=/^[a-z0-9][a-z0-9._-]{2,29}$/;

/* =====================================================================
   GRADES & PERMISSIONS
   ===================================================================== */
const PALETTE=[["#2b5fb4","Bleu"],["#e8782a","Orange"],["#1d8a4e","Vert"],["#7b3fa0","Violet"],["#c8102e","Rouge"],["#5b6882","Gris"]];
function DEF(){
  const mk=(id,t,ic,coef,arr)=>({id,t,ic,coef,crit:arr.map((a,i)=>({id:id+i,n:a[0],d:a[1],w:a[2]}))});
  return{elim:5,adm:10,ep:[

function can(k,acc){

  const o=acc.perms&&acc.perms[k];if(o===true||o===false)return o;
  const g=GRADES.find(x=>x.id===acc.grade);return !!(g&&g.perms&&g.perms[k]);
}

function noteEp(e,st){let sw=0,t=0;e.crit.forEach(c=>{const v=st.scores[c.id];if(typeof v==="number"){sw+=c.w;t+=v*c.w}});return sw?t/sw:null}
function evalC(st){
  const cfg=DB.cfg;let sc=0,t=0,done=0,tot=0;const notes={},fails=[];
  cfg.ep.forEach(e=>{
    const n=noteEp(e,st);notes[e.id]=n;
    const k=e.crit.filter(c=>typeof st.scores[c.id]==="number").length;done+=k;tot+=e.crit.length;
    if(n!==null){sc+=e.coef;t+=n*e.coef;if(k===e.crit.length&&n<cfg.elim)fails.push(e.t)}
  });
  const total=sc?t/sc:null,complete=tot>0&&done===tot;
  let v,col,key;
  if(fails.length){v="Défavorable";col=RED;key="def"}
  else if(!complete){v="En cours";col=GREY;key="cours"}
  else if(total>=cfg.adm){v="Favorable";col=OK;key="fav"}
  else{v="Insuffisant";col=WARN;key="ins"}
  return{notes,total,done,tot,complete,fails,v,col,key};
}
function isEmpty(c){return !(c.nom||"").trim()&&!(c.num||"").trim()&&!(c.eval||"").trim()&&!(c.generale||"").trim()&&!Object.values(c.scores||{}).some(v=>typeof v==="number")&&!Object.values(c.comm||{}).some(v=>(v||"").trim())}

function norm(c){c.scores=c.scores||{};c.comm=c.comm||{};return c}

async function login(u,pw){
  u=(u||"").trim().toLowerCase();
  let a=null;
  if(UREG.test(u))a=await S.get("accounts/"+u);
  let ok=false;
  if(a&&a.active!==false&&a.salt){ok=(await hashPw(pw,a.salt,a.iter))===a.hash}
  else await hashPw(pw,newSalt());
  if(!ok){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0;throw{msg:"Trop de tentatives. Compte verrouillé 30 secondes."}}throw{msg:a&&a.active===false?"Ce compte est désactivé. Contactez un administrateur.":"Identifiant ou mot de passe incorrect."}}
  fails=0;
  await startSession(Object.assign({id:u},a));
}

let cur=null,q="",fil="all",sortK="note",viewIds=[];
function getRows(){
  const cfg=DB.cfg,cl=can("classement");
  let r=DB.list.map(c=>({c,r:evalC(c)}));
  [...r].filter(x=>x.r.total!=null).sort((a,b)=>b.r.total-a.r.total).forEach((x,i)=>x.rank=i+1);
  const s=q.trim().toLowerCase();
  if(s)r=r.filter(x=>((x.c.nom||"")+" "+(x.c.num||"")+" "+(x.c.eval||"")).toLowerCase().includes(s));
  if(cl&&fil!=="all")r=r.filter(x=>x.r.key===fil);
  const cmp={note:(a,b)=>(b.r.total==null?-1:b.r.total)-(a.r.total==null?-1:a.r.total),nom:(a,b)=>nm(a.c).localeCompare(nm(b.c),"fr"),recent:(a,b)=>(b.c.created||0)-(a.c.created||0)};
  cfg.ep.forEach(e=>cmp["ep:"+e.id]=(a,b)=>(b.r.notes[e.id]==null?-1:b.r.notes[e.id])-(a.r.notes[e.id]==null?-1:a.r.notes[e.id]));
  r.sort(cmp[cl?sortK:(sortK==="nom"?"nom":"recent")]||cmp.recent);
  return r;
}

function mergeRemote(c,r){

function bilan(c){
  const r=evalC(c),cfg=DB.cfg;
  let o=`GRILLE DE NOTATION – POLICE NATIONALE\nCandidat : ${nm(c)} (n° ${c.num||"—"})\nDate : ${c.date||"—"} · Évaluateur : ${c.eval||"—"}\n\n`;
  cfg.ep.forEach(e=>{o+=`${e.t} (coef. ${e.coef}) : ${fmt(r.notes[e.id])}/20\n`;e.crit.forEach(k=>{o+=`   - ${k.n} : ${typeof c.scores[k.id]==="number"?fmt(c.scores[k.id])+"/20":"non noté"}\n`});if(c.comm&&c.comm[e.id])o+=`   Obs. : ${c.comm[e.id]}\n`});
  o+=`\nNOTE FINALE : ${fmt(r.total)}/20 → ${r.v}${r.fails.length?" (note éliminatoire : "+r.fails.join(", ")+")":""}\n`;
  if(c.generale)o+=`\nAppréciation : ${c.generale}\n`;
  return o;
}
const sortedAll=()=>DB.list.map(c=>({c,r:evalC(c)})).sort((a,b)=>(b.r.total==null?-1:b.r.total)-(a.r.total==null?-1:a.r.total));
const rankText=()=>"CLASSEMENT – POLICE NATIONALE\n"+sortedAll().map((o,i)=>`${i+1}. ${nm(o.c)} — ${fmt(o.r.total)}/20 (${DB.cfg.ep.map(e=>e.t+" "+fmt(o.r.notes[e.id])).join(", ")}) → ${o.r.v}`).join("\n");
function csvText(){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const head=["Rang","Nom","N°","Date","Évaluateur"].concat(DB.cfg.ep.map(e=>e.t),["Note finale","Avis"]);
  const lines=[head.map(q).join(";")];
  sortedAll().forEach((o,i)=>lines.push([i+1,nm(o.c),o.c.num,o.c.date,o.c.eval].concat(DB.cfg.ep.map(e=>fmt(o.r.notes[e.id])),[fmt(o.r.total),o.r.v]).map(q).join(";")));
  return lines.join("\n");
}

     ${canAdminFlag?`<label class="chk"><input type="checkbox" id="aadm" ${editing&&a.admin?"checked":""}> Compte administrateur (tous les droits)</label>`:""}
     ${editing&&!self?`<label class="chk"><input type="checkbox" id="aact" ${a.active!==false?"checked":""}> Compte actif (décochez pour bloquer la connexion)</label>`:""}
     <div><label for="apw">${editing?"Nouveau mot de passe (laisser vide pour ne pas changer)":"Mot de passe provisoire (8 caractères minimum)"}</label>
       <div class="btns" style="flex-wrap:nowrap"><input id="apw" type="text" autocomplete="off" style="font-family:monospace"><button class="sec" type="button" data-act="genpw" title="Générer">🎲</button></div></div>
     <label class="chk"><input type="checkbox" id="amust" ${editing?"":"checked"}> L'utilisateur doit changer son mot de passe à sa prochaine connexion</label>
     <div class="err" id="aerr">${esc(note||"")}</div>
     <div class="btns"><button data-act="saveacc" data-id="${editing?esc(a.id):""}">${editing?"Enregistrer":"Créer le compte"}</button>
       ${editing?`<button class="sec" data-act="permacc" data-id="${esc(a.id)}">🔐 Permissions individuelles</button>`:""}
       ${editing&&!self?`<button class="danger" data-act="delacc" data-id="${esc(a.id)}">🗑 Supprimer</button>`:""}</div>
   </div>`);
}
async function saveAccount(id){
  const er=$("#aerr");er.textContent="";er.className="err";
  const a=id?ACC.find(x=>x.id===id):null;
  const nom=$("#an").value.trim(),pw=$("#apw").value,must=$("#amust").checked;
  const gradeSel=$("#ag").value;
  const admEl=$("#aadm"),actEl=$("#aact");
  if(!nom){er.textContent="Indiquez le nom affiché.";return}
  if(!ME.admin&&gi(gradeSel)<=gi(ME.grade)&&!(a&&a.grade===gradeSel)){er.textContent="Vous ne pouvez pas attribuer un grade égal ou supérieur au vôtre.";return}
  try{
    if(!a){
      const u=$("#ai").value.trim().toLowerCase();
      if(!UREG.test(u)){er.textContent="Identifiant invalide (3 à 30 caractères : a-z, 0-9, . _ -).";return}
      if(ACC.some(x=>x.id===u)){er.textContent="Cet identifiant existe déjà.";return}
      if(pw.length<8){er.textContent="Mot de passe provisoire : 8 caractères minimum (utilisez 🎲).";return}
      const salt=newSalt(),hash=await hashPw(pw,salt,ITER);
      await S.set("accounts/"+u,{nom,grade:gradeSel,admin:!!(admEl&&admEl.checked),perms:{},active:true,must,salt,iter:ITER,hash,created:Date.now(),createdBy:ME.id});
      // relecture : on n'annonce le succès que si le compte est réellement dans la base et que le mot de passe fonctionne
      const chk=await tmo(S.get("accounts/"+u),12000,"Vérification du compte");
      if(!chk||chk.hash!==hash||(await hashPw(pw,chk.salt,chk.iter))!==chk.hash)throw{message:"Le compte n'a pas été enregistré dans la base partagée"};
      SV={n:"created"};
      sheet(shead("✅ Compte créé","accounts")+`<p>Le compte <b>${esc(u)}</b> (${esc(nom)}) a été créé.</p><p class="note" style="margin:0 0 6px">Mot de passe provisoire à transmettre à la personne${must?" (elle devra le changer à sa première connexion)":""} :</p><div class="pw-show">${esc(pw)}</div><p class="note">Ce mot de passe ne sera plus affichable ensuite.</p><div class="btns" style="margin-top:12px"><button data-act="newacc">＋ Créer un autre compte</button><button class="sec" data-act="accounts">Retour à la liste</button></div>`);
      return;
    }
    const upd={nom};
    if(!a.admin||ME.admin)upd.grade=gradeSel;
    if(admEl){
      if(a.admin&&!admEl.checked&&adminCount()<=1){er.textContent="Impossible : il doit rester au moins un administrateur actif.";return}
      upd.admin=admEl.checked;
    }
    if(actEl){
      if(a.admin&&!actEl.checked&&adminCount()<=1){er.textContent="Impossible de désactiver le dernier administrateur.";return}
      upd.active=actEl.checked;
    }
    if(pw){
      if(pw.length<8){er.textContent="Mot de passe : 8 caractères minimum.";return}
      upd.salt=newSalt();upd.iter=ITER;upd.hash=await hashPw(pw,upd.salt,ITER);upd.must=must;
    }else if(must!==!!a.must)upd.must=must;
    await S.update("accounts/"+a.id,upd);
    if(upd.hash){const chk=await tmo(S.get("accounts/"+a.id),12000,"Vérification du compte");if(!chk||chk.hash!==upd.hash)throw{message:"Le nouveau mot de passe n'a pas été enregistré"}}
    if(a.id===ME.id){ME=Object.assign(ME,upd);if(upd.hash)setSess({u:ME.id,h:ME.hash})}
    toast("Compte mis à jour ✓"+(pw?" — nouveau mot de passe : "+pw:""));renderAccounts();
  }catch(x){fail(x);er.textContent="Échec de l'enregistrement : "+((x&&x.message)||"erreur inconnue")}
}
function renderPermsOverride(id){
  const a=ACC.find(x=>x.id===id);if(!a||!(canManage(a)||a.id===ME.id)){renderAccounts();return}
  SV={n:"perms"};
  const perms=permList(),groups=[...new Set(perms.map(p=>p.g))],g=gradeOf(a.grade);
  sheet(shead("🔐 Permissions individuelles – "+esc(a.id),"editacc:"+id)+`
   <p class="note" style="margin:0 0 6px">Par défaut, les droits viennent du grade (${gbadge(a.grade)}). Vous pouvez ici autoriser ou refuser une permission pour ce compte uniquement.${a.admin?" <b>Ce compte est administrateur : tous les droits lui sont accordés quelles que soient ces réglages.</b>":""}</p>
   ${groups.map(gr=>`<div class="pcat">${esc(gr)}</div>${perms.filter(p=>p.g===gr).map(p=>{
     const o=a.perms&&a.perms[p.k],inh=!!(g&&g.perms&&g.perms[p.k]);
     const dis=!(ME.admin||can(p.k))||a.id===ME.id&&!ME.admin;
     return`<div class="pline"><span>${esc(p.l)}</span><select data-pov="${esc(p.k)}" data-id="${esc(id)}" ${dis?"disabled":""}><option value="" ${o!==true&&o!==false?"selected":""}>Selon le grade (${inh?"oui":"non"})</option><option value="1" ${o===true?"selected":""}>✅ Autoriser</option><option value="0" ${o===false?"selected":""}>⛔ Refuser</option></select></div>`}).join("")}`).join("")}
   <p class="note">Vous ne pouvez accorder que des permissions que vous possédez vous-même.</p>`);
}
function renderGrades(){
  if(!can("grades"))return;SV={n:"grades"};
  const adm=ME.admin,my=gi(ME.grade),edt=i=>adm||i>my;
  const perms=permList(),groups=[...new Set(perms.map(p=>p.g))];
  sheet(shead("🏅 Grades & permissions")+`
   <p class="note" style="margin:0 0 8px">Cochez les permissions de chaque grade. L'ordre des colonnes = la hiérarchie (du plus haut au plus bas). Les administrateurs ont tous les droits. Les comptes peuvent aussi avoir des permissions individuelles qui priment sur leur grade.</p>
   <div class="tw"><table class="mx"><thead><tr><th class="p">Permission</th>${GRADES.map((g,i)=>`<th style="min-width:118px"><input type="text" value="${esc(g.name)}" data-gn="${i}" ${edt(i)?"":"disabled"}>
     <div class="btns" style="justify-content:center;margin-top:4px;gap:3px"><select data-gc="${i}" ${edt(i)?"":"disabled"}>${PALETTE.map(c=>`<option value="${c[0]}" ${c[0]===g.color?"selected":""}>${c[1]}</option>`).join("")}</select>
     ${adm?`<button class="sec small" data-act="gmv" data-i="${i}" data-d="-1" ${i===0?"disabled":""}>◀</button><button class="sec small" data-act="gmv" data-i="${i}" data-d="1" ${i===GRADES.length-1?"disabled":""}>▶</button>`:""}
     ${edt(i)?`<button class="danger small" data-act="gdel" data-i="${i}">✕</button>`:""}</div></th>`).join("")}</tr></thead><tbody>
   ${groups.map(gr=>`<tr class="grp"><td colspan="${GRADES.length+1}">${esc(gr)}</td></tr>`+perms.filter(p=>p.g===gr).map(p=>`<tr><td class="p">${esc(p.l)}</td>${GRADES.map((g,i)=>`<td><input type="checkbox" data-gi="${i}" data-gk="${esc(p.k)}" ${g.perms&&g.perms[p.k]?"checked":""} ${edt(i)&&(adm||can(p.k))?"":"disabled"}></td>`).join("")}</tr>`).join("")).join("")}
   </tbody></table></div>
   <div class="btns" style="margin-top:12px"><button data-act="gadd">＋ Ajouter un grade</button>${adm?'<button class="danger" data-act="greset">Restaurer les grades par défaut</button>':""}</div>
   <p class="note">Vous ne pouvez modifier que les grades situés sous le vôtre${adm?" (administrateur : tous)":""}, et n'accorder que des permissions que vous possédez.</p>`);
}
function saveGrades(now){
  clearTimeout(gTimer);
  const go=()=>{gTimer=null;enqueue("config/grades",()=>S.set("config/grades",{list:clone(GRADES),v:GVER})).catch(fail)};
  if(now){gTimer=null;go()}else gTimer=setTimeout(go,500);
  gTimer=gTimer||null;
}

/* ---------- événements de la fenêtre (délégation) ---------- */
$("#sbox").addEventListener("click",async e=>{
  const t=e.target.closest("[data-act],[data-addc],[data-delc],#setReset");if(!t)return;
  const cfg=DB.cfg;
  if(t.id==="setReset"){askConfirm("Restaurer les critères, coefficients et seuils par défaut ?",()=>{DB.cfg=DEF();saveCfgNow();renderSettings();renderAll()},"Restaurer");return}
  if(t.dataset.addc!=null){const ep=cfg.ep[+t.dataset.addc];ep.crit.push({id:ep.id+"_"+Date.now().toString(36),n:"Nouveau critère",d:"",w:1});saveCfg();renderSettings();renderAll();return}
  if(t.dataset.delc!=null){const[i,j]=t.dataset.delc.split(".").map(Number);if(cfg.ep[i].crit.length<=1){toast("Une épreuve doit garder au moins un critère");return}cfg.ep[i].crit.splice(j,1);saveCfg();renderSettings();renderAll();return}
  const act=t.dataset.act,id=t.dataset.id;
  if(act==="accounts")renderAccounts();
  else if(act==="newacc")renderAccountForm(null);
  else if(act==="editacc")renderAccountForm(id);
  else if(act&&act.indexOf("editacc:")===0)renderAccountForm(act.slice(8));
  else if(act==="genpw"){$("#apw").value=genPw()}
  else if(act==="saveacc")saveAccount(id);
  else if(act==="permacc")renderPermsOverride(id);
  else if(act==="delacc"){
    const a=ACC.find(x=>x.id===id);if(!a||!canManage(a)||a.id===ME.id)return;
    if(a.admin&&adminCount()<=1){toast("Impossible de supprimer le dernier administrateur");return}
    askConfirm("Supprimer définitivement le compte « "+a.id+" » ?",()=>{S.del("accounts/"+a.id).then(()=>{toast("Compte supprimé");renderAccounts()}).catch(fail)});
  }
  else if(act==="mypw"){
    const er=$("#mperr");er.textContent="";
    const p0=$("#mp0").value,p1=$("#mp1").value;
    if(p1.length<8){er.textContent="Le nouveau mot de passe doit contenir au moins 8 caractères.";return}
    if(p1!==$("#mp2").value){er.textContent="Les deux mots de passe ne correspondent pas.";return}
    try{
      if((await hashPw(p0,ME.salt,ME.iter))!==ME.hash){er.textContent="Mot de passe actuel incorrect.";return}
      await setPassword(ME.id,p1,false);toast("Mot de passe modifié ✓");renderMyAccount();
    }catch(x){fail(x);er.textContent="Échec de l'enregistrement."}
  }
  else if(act==="gmv"){
    const i=+t.dataset.i,d=+t.dataset.d,j=i+d;if(j<0||j>=GRADES.length)return;
    [GRADES[i],GRADES[j]]=[GRADES[j],GRADES[i]];saveGrades(true);renderGrades();applyPerms();
  }
  else if(act==="gdel"){
    const i=+t.dataset.i,g=GRADES[i];
    if(ACC.some(a=>a.grade===g.id)){toast("Ce grade est attribué à des comptes : changez d'abord leur grade");return}
    if(GRADES.length<=1){toast("Il faut garder au moins un grade");return}
    askConfirm("Supprimer le grade « "+g.name+" » ?",()=>{GRADES.splice(i,1);saveGrades(true);renderGrades()});
  }
  else if(act==="gadd"){GRADES.push({id:"g"+Date.now().toString(36),name:"Nouveau grade",color:GREY,perms:{cand_voir:true}});saveGrades(true);renderGrades()}
  else if(act==="greset"){askConfirm("Restaurer les six grades par défaut ? Les comptes dont le grade n'existe plus seront « sans grade ».",()=>{GRADES=DEFGRADES();saveGrades(true);renderGrades();applyPerms()},"Restaurer")}
});
$("#sbox").addEventListener("input",e=>{
  const t=e.target,cfg=DB.cfg;
  if(t.dataset.sk&&can("config")){cfg[t.dataset.sk]=Math.max(0,Math.min(20,parseFloat(t.value)||0));saveCfg();renderAll()}
  else if(t.dataset.ep!=null&&can("config")){const ep=cfg.ep[+t.dataset.ep];if(!ep)return;const f=t.dataset.f;ep[f]=f==="coef"?Math.max(0,parseFloat(t.value)||0):t.value;saveCfg();renderAll()}
  else if(t.dataset.cr&&can("config")){const[i,j]=t.dataset.cr.split(".").map(Number),c=cfg.ep[i]&&cfg.ep[i].crit[j];if(!c)return;const f=t.dataset.f;c[f]=f==="w"?Math.max(0,parseFloat(t.value)||0):t.value;saveCfg();renderAll()}
  else if(t.dataset.gn!=null){const g=GRADES[+t.dataset.gn];if(!g)return;g.name=t.value;saveGrades(false);renderUserbar()}
});
$("#sbox").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.gc!=null){const g=GRADES[+t.dataset.gc];if(g){g.color=t.value;saveGrades(true);renderUserbar()}}
  else if(t.dataset.gi!=null){
    const g=GRADES[+t.dataset.gi];if(!g)return;g.perms=g.perms||{};
    if(t.checked)g.perms[t.dataset.gk]=true;else delete g.perms[t.dataset.gk];
    saveGrades(true);applyPerms();
  }
  else if(t.dataset.pov){
    const a=ACC.find(x=>x.id===t.dataset.id);if(!a)return;
    const v=t.value===""?null:t.value==="1";
    S.update("accounts/"+a.id,{perms:{[t.dataset.pov]:v}}).then(()=>toast("Permission mise à jour ✓")).catch(fail);
    a.perms=Object.assign({},a.perms,{[t.dataset.pov]:v});
  }
});

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
async function boot(forceLocal){
  try{
    gate('<div class="gload">Chargement…</div>');
    if(!forceLocal)await initPlatform();
    if(!window.crypto||!crypto.subtle){viewError("Ce navigateur ou ce contexte ne permet pas le chiffrement des mots de passe (HTTPS requis).");return}
    if(ONPLATFORM&&!DBAPI){viewError("La base de données partagée n'est pas disponible dans cette vue. Ouvrez la page depuis son lien claude.ai, en étant connecté à votre compte Claude, avec au moins le niveau « Contributeur ».",errTxt(BOOTERR));return}
    S=DBAPI?Cloud:Local;
    const se=getSess();
    if(se&&UREG.test(se.u||"")){
      status("Reconnexion…");
      let a=null;try{a=await tmo(S.get("accounts/"+se.u),15000,"Lecture du compte")}catch(e){console.error(e)}
      if(a&&a.active!==false&&a.hash===se.h){await startSession(Object.assign({id:se.u},a));return}
      setSess(null);
    }
    viewLogin(""); // En mode GitHub Pages, les comptes sont stockés localement dans ce navigateur.
  }catch(e){console.error(e);viewError("Une erreur est survenue au démarrage.",errTxt(e))}
}
window.addEventListener("unhandledrejection",e=>{if(document.querySelector("#gate .gload"))viewError("Une erreur est survenue au démarrage.",errTxt(e.reason))});
window.addEventListener("error",e=>{if(document.querySelector("#gate .gload"))viewError("Une erreur est survenue au démarrage.",e.message)});
boot();
</script>
